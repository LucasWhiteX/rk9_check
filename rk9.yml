name: RK9 monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rk9-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verificar RK9
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
        run: python rk9_monitor.py

      - name: Guardar estado
        run: |
          git config user.name "rk9-bot"
          git config user.email "rk9-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Atualizar estado RK9" && git push)
