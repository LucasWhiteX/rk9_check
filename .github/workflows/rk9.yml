name: RK9 monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rk9-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verificar RK9
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
        run: python rk9_monitor.py
      - name: Verificar spoilers
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SPOILERS_WEBHOOK_URL: ${{ secrets.DISCORD_SPOILERS_WEBHOOK_URL }}
        run: python spoilers.py
      - name: Verificar cartas novas (TCGdex)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SPOILERS_WEBHOOK_URL: ${{ secrets.DISCORD_SPOILERS_WEBHOOK_URL }}
        run: python new_cards.py
      - name: Guardar estado
        run: |
          git config user.name "rk9-bot"
          git config user.email "rk9-bot@users.noreply.github.com"
          for f in state.json spoilers_state.json new_cards_state.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Atualizar estado" && git push)
